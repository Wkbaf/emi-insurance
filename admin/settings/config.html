<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Cấu hình website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="../assets/image/favicon.png?v=2">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/giai-ma-thuat-ngu.css">
    <link rel="stylesheet" href="../assets/css/shared.css">

    <style>
        .section-toggle-card {
            border: 1px solid #eadfc8;
            border-radius: 18px;
            padding: 20px;
            background: #fffdf8;
            margin-bottom: 16px;
        }

        .section-toggle-card h6 {
            color: #004c45;
            margin-bottom: 4px;
        }

        .section-toggle-desc {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 0;
        }

        .save-status {
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .save-status.success {
            color: #0f766e;
        }

        .save-status.error {
            color: #b91c1c;
        }
    </style>
</head>

<body>

    <button class="sidebar-collapse-btn" onclick="toggleSidebarCollapse()">
        <i class="bi bi-arrow-left-short"></i>
    </button>

    <button class="mobile-menu-btn" onclick="openMobileSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <div class="sidebar-overlay" onclick="closeMobileSidebar()"></div>
    <div class="sidebar">
        <div id="adminNavbar"></div>
    </div>

    <div class="main-content">

        <div class="topbar d-flex justify-content-between align-items-center">
            <div>
                <h3 class="mb-1 fw-bold">Cấu hình website</h3>
                <div class="text-muted">Bật / tắt các section trên trang chủ</div>
            </div>

            <div class="d-flex align-items-center gap-3">
                <div class="text-end">
                    <div class="fw-semibold">Admin</div>
                    <small class="text-muted">Online</small>
                </div>
                <div class="admin-avatar">A</div>
            </div>
        </div>

        <div class="content-card">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <h4 class="fw-bold mb-1">Trang chủ (index.html)</h4>
                    <div class="text-muted">
                        Thay đổi sẽ áp dụng ngay trên website sau khi lưu.
                    </div>
                </div>

                <button class="btn btn-primary-custom" id="saveBtn" onclick="saveSiteConfig()">
                    <i class="bi bi-save me-2"></i>
                    Lưu cấu hình
                </button>
            </div>

            <div class="section-toggle-card">
                <div class="d-flex justify-content-between align-items-start gap-3">
                    <div>
                        <h6 class="fw-bold">Section Đối tác (Hệ Sinh Thái Liên Kết)</h6>
                        <p class="section-toggle-desc">
                            Hiển thị slider logo các thương hiệu bảo hiểm đối tác trên trang chủ.
                        </p>
                    </div>

                    <div class="form-check form-switch m-0">
                        <input class="form-check-input" type="checkbox" role="switch" id="partnerSectionEnabled">
                    </div>
                </div>
            </div>

            <div id="saveStatus" class="save-status"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="../assets/js/firebase.js"></script>
    <script src="../assets/js/navbar.js"></script>
    <script src="../assets/js/auth-guard.js"></script>
    <script src="../assets/js/config.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
