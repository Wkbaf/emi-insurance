<!DOCTYPE html>
<html lang="vi">

    <head>
        <meta charset="UTF-8">

        <title>Admin Login</title>

        <meta
        name="viewport" content="width=device-width, initial-scale=1">

        <!-- Bootstrap -->
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;

                background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), url("assets/image/background.avif");

                background-size: cover;
                background-position: center;

                display: flex;
                align-items: center;
                justify-content: center;

                font-family: Arial, sans-serif;

                padding: 20px;
            }

            .login-card {
                width: 100%;
                max-width: 430px;

                border: none;
                border-radius: 28px;

                overflow: hidden;

                backdrop-filter: blur(14px);

                background: rgba(255, 255, 255, 0.96);

                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            }

            .brand-logo {
                width: 82px;
                height: 82px;

                border-radius: 24px;

                background: linear-gradient(135deg, #0f766e, #14b8a6);

                display: flex;
                align-items: center;
                justify-content: center;

                margin: auto;

                color: white;

                font-size: 34px;

                box-shadow: 0 10px 30px rgba(20, 184, 166, 0.35);
            }

            .title {
                font-weight: 700;
                color: #111827;
            }

            .subtitle {
                color: #6b7280;
            }

            .form-control {
                height: 56px;

                border-radius: 16px;

                border: 1px solid #d1d5db;

                padding-left: 16px;

                transition: 0.3s;
            }

            .form-control:focus {
                border-color: #14b8a6;

                box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.12);
            }

            .btn-login {
                height: 56px;

                border-radius: 16px;

                background: linear-gradient(135deg, #0f766e, #14b8a6);

                border: none;

                font-weight: 600;

                font-size: 16px;

                transition: 0.3s;
            }

            .btn-login:hover {
                transform: translateY(-2px);

                background: linear-gradient(135deg, #115e59, #0f766e);
            }

            .btn-login:active {
                transform: scale(0.98);
            }

            .loading {
                opacity: 0.7;
                pointer-events: none;
            }

            .copyright {
                color: #9ca3af;
                font-size: 14px;
            }

            #error {
                min-height: 24px;
                font-size: 14px;
            }
        </style>
    </head>

    <body>

        <div
            class="card login-card p-4 p-md-5">

            <!-- Header -->
            <div class="text-center mb-4">

                <div class="brand-logo mb-4">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>

                <h2 class="title mb-2">
                    EMI Admin
                </h2>

                <p class="subtitle mb-0">
                    Đăng nhập để quản lý hệ thống
                </p>

            </div>

            <!-- Form -->
            <form
                id="loginForm">

                <!-- Email -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Email
                    </label>

                    <div class="input-group">

                        <span class="input-group-text bg-white border-end-0 rounded-start-4">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input id="email" type="email" class="form-control border-start-0 rounded-end-4" placeholder="Nhập email admin" required>

                    </div>

                </div>

                <!-- Password -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Mật khẩu
                    </label>

                    <div class="input-group">

                        <span class="input-group-text bg-white border-end-0 rounded-start-4">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input id="password" type="password" class="form-control border-start-0 border-end-0" placeholder="Nhập mật khẩu" required>

                        <button type="button" class="input-group-text bg-white rounded-end-4" id="togglePassword">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>

                <!-- Button -->
                <button id="loginBtn" type="submit" class="btn btn-login text-white w-100">

                    <i class="bi bi-box-arrow-in-right me-2"></i>

                    Đăng nhập

                </button>

            </form>

            <!-- Error -->
            <p id="error" class="text-danger text-center mt-3 mb-0"></p>

            <!-- Footer -->
            <div class="text-center mt-4">

                <div class="copyright">
                    © 2026 EMI Insurance Admin
                </div>

            </div>

        </div>

        <!-- Firebase -->
        <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

        <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

        <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

        <script src="assets/js/firebase.js"></script>

        <script>
            const auth = firebase.auth();

            // Auto redirect nếu đã login
            firebase.auth().onAuthStateChanged(async (user) => {

                if (user) {

                    const tokenResult = await user.getIdTokenResult();

                    if (tokenResult.claims.role) {
                        window.location.replace("dashboard.html");
                    }

                }

            });

            // Toggle Password
            document.getElementById("togglePassword").addEventListener("click", function () {

                const password = document.getElementById("password");

                const icon = this.querySelector("i");

                if (password.type === "password") {

                    password.type = "text";

                    icon.classList.remove("bi-eye");

                    icon.classList.add("bi-eye-slash");

                } else {

                    password.type = "password";

                    icon.classList.remove("bi-eye-slash");

                    icon.classList.add("bi-eye");

                }

            });

            // Login Form
            document.getElementById("loginForm").addEventListener("submit", async function (e) {

                e.preventDefault();

                await login();

            });

            // Login Function
            async function login() {

                const email = document.getElementById("email").value.trim();

                const password = document.getElementById("password").value;

                const error = document.getElementById("error");

                const loginBtn = document.getElementById("loginBtn");

                try {

                    error.innerText = "";

                    loginBtn.classList.add("loading");

                    loginBtn.innerHTML = `
                    <span class="spinner-border spinner-border-sm me-2"></span>
                    Đang đăng nhập...
                `;

                    await auth.signInWithEmailAndPassword(email, password);

                    window.location.href = "dashboard.html";

                } catch (err) {

                    console.log(err);

                    error.innerText = "Sai email hoặc mật khẩu";

                    loginBtn.classList.remove("loading");

                    loginBtn.innerHTML = `
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Đăng nhập
                `;
                }

            }
        </script>

    </body>

</html>
