<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chi tiết Blog | EMI Insurance</title>
    <link rel="icon" href="assets/image/favicon.png?v=2">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/css/nav.css">
    <link rel="stylesheet" href="assets/css/shared.css">
    <link rel="stylesheet" href="assets/css/contact.css">
    <link rel="stylesheet" href="assets/css/footer.css">
    <link rel="stylesheet" href="assets/css/blog-shared/blog.css">
    <link rel="stylesheet" href="assets/css/blog-shared/emi-detail-shared.css">
</head>

<body>
    <emi-nav active="products"></emi-nav>

    <main id="blogDetailApp">
        <section class="blog-detail-hero" id="blogDetailHero">
            <div class="container">
                <div id="heroContent" class="loading-box">Đang tải blog...</div>
            </div>
        </section>

        <section class="blog-section">
            <div class="container">
                <nav class="detail-breadcrumb">
                    <a href="blog.html">Góc Nhìn Chuyên Gia</a>
                    <i class="fa-solid fa-chevron-right"></i>
                    <span id="pageCategory">Phân tích Giải pháp</span>
                </nav>

                <div class="row g-4 align-items-start">
                    <div class="col-lg-8">
                        <article class="blog-card" id="articleContent">
                            <div class="loading-box">Đang tải nội dung chi tiết...</div>
                        </article>
                    </div>

                    <div class="col-lg-4">
                        <aside class="detail-sidebar" id="detailSidebar">
                            <div class="sidebar-card result-inline" id="sidebarResults">
                                <h3>Điểm nổi bật</h3>
                                <p class="mb-0 text-white-50">Đang tải...</p>
                            </div>

                            <div class="sidebar-card quote-inline" id="sidebarQuote">
                                Đang tải quote...
                                <span>— EMI</span>
                            </div>

                            <div class="sidebar-card">
                                <div class="sidebar-title">Categories Cloud</div>
                                <div class="category-cloud" id="categoryCloud">
                                    <span class="text-muted small">Đang tải...</span>
                                </div>
                            </div>

                            <div class="sidebar-card">
                                <div class="sidebar-title">Popular Posts</div>
                                <div class="popular-list" id="popularPosts">
                                    <span class="text-muted small">Đang tải...</span>
                                </div>
                            </div>
                        </aside>
                    </div>
                </div>
            </div>
        </section>

        <emi-contact></emi-contact>
    </main>

    <emi-footer></emi-footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/shared/emi-nav.js"></script>
    <script src="assets/js/shared/emi-contact.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/shared/footer.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="assets/js/shared/firebase.js"></script>

    <script src="assets/js/shared/emi-blog-detail.js"></script>

    <script>
        window.EMIDetailPage.init({
            heroId: "blogDetailHero",
            collectionName: "blogs",
            entityLabel: "Blog",
            entityLabelLower: "blog",
            defaultTitle: "Blog",
            defaultCategory: "Chuỗi Video Thực Chiến",
            breadcrumbLabel: "Blog",
            listPageUrl: "blog.html",
            detailPageUrl: "blog-detail.html",
            heroDescClass: "blog-hero-desc",
            metaClass: "blog-meta",
            articleIconClass: "fa-solid fa-play",
            sidebarResultTitle: "Điểm nổi bật",
            readingTimeLabel: "Thời lượng",
            readingTimeFields: ["readingTime", "videoDuration"],
            dateFields: ["updatedDate", "updatedAt", "createdAt"],
            defaultReadingTime: "5 phút",
            showVideo: true,
            showAuthor: true,
            defaultQuote: "Học từ tình huống thực tế giúp bạn triển khai nhanh và chắc hơn."
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const hero = document.getElementById("blogDetailHero");
            const heroContent = document.getElementById("heroContent");
            const articleContent = document.getElementById("articleContent");
            const sidebarResults = document.getElementById("sidebarResults");
            const sidebarQuote = document.getElementById("sidebarQuote");
            const categoryCloud = document.getElementById("categoryCloud");
            const popularPosts = document.getElementById("popularPosts");

            const params = new URLSearchParams(window.location.search);
            let blogId = params.get("id");

            if (!blogId && window.location.hash) {
                blogId = decodeURIComponent(window.location.hash.replace("#", ""));
            }
        });
    </script>
</body>

</html>
